name: Publicar thread

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: threads-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[PUBLISH]')
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar thread somente em texto
        id: publish
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/publish-thread.mjs

      - name: Publicar o mesmo conteúdo no Telegram
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHANNEL_ID;
          const output = process.env.GITHUB_OUTPUT;

          if (!token || !chatId) {
            if (output) fs.appendFileSync(output, "status=não configurado\\n");
            console.log("Telegram ainda não configurado; publicação ignorada.");
            process.exit(0);
          }

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const payload = JSON.parse(event.issue?.body || "{}");
          if (!Array.isArray(payload.parts) || payload.parts.length < 1) throw new Error("O JSON não contém parts.");

          const normalize = value =>
            String(value)
              .replace(/\\n/g, "\n")
              .replace(/\r\n?/g, "\n")
              .trim();

          const escapeHtml = value =>
            normalize(value)
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;");

          const formatParagraph = (paragraph, emphasizeIntro = false) => {
            const text = normalize(paragraph);
            if (/^Prompt:\s*/i.test(text)) {
              const promptText = text.replace(/^Prompt:\s*/i, "").trim();
              return "<b>Prompt:</b>\n<i>" + escapeHtml(promptText) + "</i>";
            }
            if (emphasizeIntro && !/https?:\/\//i.test(text)) {
              return "<b>" + escapeHtml(text) + "</b>";
            }
            return escapeHtml(text);
          };

          const formatPart = (part, index) => {
            const paragraphs = normalize(part)
              .split(/\n{2,}/)
              .map(value => value.trim())
              .filter(Boolean);

            if (!paragraphs.length) return "";

            if (index === 0) {
              const firstLines = paragraphs[0].split("\n");
              const title = firstLines.shift()?.trim() || "";
              const opening = firstLines.join("\n").trim();
              const sections = ["<b>" + escapeHtml(title) + "</b>"];
              if (opening) sections.push(escapeHtml(opening));
              sections.push(...paragraphs.slice(1).map(value => formatParagraph(value)));
              return sections.filter(Boolean).join("\n\n");
            }

            return paragraphs
              .map((value, paragraphIndex) => formatParagraph(value, paragraphIndex === 0))
              .join("\n\n");
          };

          const formattedParts = payload.parts
            .map((part, index) => formatPart(part, index))
            .filter(Boolean);

          const chunks = [];
          let current = "";
          for (const part of formattedParts) {
            const candidate = current ? current + "\n\n" + part : part;
            if (candidate.length > 4000 && current) {
              chunks.push(current);
              current = part;
            } else {
              current = candidate;
            }
          }
          if (current) chunks.push(current);

          for (const text of chunks) {
            const response = await fetch("https://api.telegram.org/bot" + token + "/sendMessage", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: chatId,
                text,
                parse_mode: "HTML",
                disable_web_page_preview: false
              })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.ok) {
              throw new Error(data.description || "Telegram HTTP " + response.status);
            }
          }

          if (output) fs.appendFileSync(output, `status=publicado (${chunks.length} mensagem(ns))\\n`);
          NODE

      - name: Registrar sucesso
        if: success()
        uses: actions/github-script@v8
        env:
          PERMALINK: ${{ steps.publish.outputs.permalink }}
          ROOT_ID: ${{ steps.publish.outputs.root_id }}
        with:
          script: |
            const link = process.env.PERMALINK
              ? `\n\nLink: ${process.env.PERMALINK}`
              : `\n\nID: ${process.env.ROOT_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Thread publicada com sucesso, somente em texto.${link}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Registrar falha
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "❌ A publicação falhou. Consulte a execução do GitHub Actions para ver o erro. A issue permaneceu aberta para nova tentativa."
            });

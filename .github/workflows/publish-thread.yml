name: Publicar thread

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: threads-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[PUBLISH]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar renderizador
        run: npm install --no-save --no-package-lock sharp@0.34.4

      - name: Gerar capa editorial
        id: render
        run: node scripts/render-thread-cover.mjs

      - name: Guardar capa para diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: capa-thread-${{ github.event.issue.number }}
          path: public/thread-covers/${{ github.event.issue.number }}
          retention-days: 7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicação da capa
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar capa temporária
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publicar no Threads
        id: publish
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/publish-thread.mjs

      - name: Registrar sucesso
        if: success()
        uses: actions/github-script@v8
        env:
          PERMALINK: ${{ steps.publish.outputs.permalink }}
          ROOT_ID: ${{ steps.publish.outputs.root_id }}
        with:
          script: |
            const link = process.env.PERMALINK
              ? `\n\nLink: ${process.env.PERMALINK}`
              : `\n\nID: ${process.env.ROOT_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Thread publicada com sucesso.${link}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Registrar falha
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "❌ A publicação falhou. Consulte a execução do GitHub Actions para ver o erro. A issue permaneceu aberta para nova tentativa."
            });
